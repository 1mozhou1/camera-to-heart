<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>粒子海 · 捏合变爱心</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #020418;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');

    // ── 画布尺寸 ──────────────────────────────
    let W, H, cx, cy, heartScale;
    function resize() {
        W = c.width  = window.innerWidth;
        H = c.height = window.innerHeight;
        cx = W / 2;
        cy = H * 0.50;
        heartScale = Math.min(W, H) * 0.022;
    }
    window.addEventListener('resize', () => { resize(); generateAll(); });
    resize();

    // ── 爱心形状检测 ──────────────────────────
    function insideHeart(px, py) {
        const nx = px / 16;
        const ny = py / 17;
        return Math.pow(nx*nx + ny*ny - 1, 3) - nx*nx * ny*ny*ny <= 0;
    }

    // ── 海粒子坐标 ────────────────────────────
    function generateSeaPositions(count) {
        const arr = [];
        for (let i = 0; i < count; i++) {
            arr.push({
                nx: Math.random(),
                ny: Math.random(),
                wp: Math.random() * Math.PI * 2,
            });
        }
        return arr;
    }

    // ── 爱心粒子（星云质感）────────────────────
    function generateHeartPositions(total) {
        const outlineN = Math.floor(total * 0.22);
        const interiorN = total - outlineN;
        const arr = [];

        // 轮廓
        for (let i = 0; i < outlineN; i++) {
            const t = (i / outlineN) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const sc = 0.2 + Math.random() * 0.7;
            const a  = Math.random() * Math.PI * 2;
            arr.push({
                hx: hx + Math.cos(a) * sc,
                hy: hy + Math.sin(a) * sc,
                hz: 0.2 + Math.random() * 0.8,
                type: 'outline'
            });
        }

        // 内部填充 —— 拒绝采样 + 密度偏置
        let gen = 0, tries = 0;
        const maxTries = interiorN * 8;
        while (gen < interiorN && tries < maxTries) {
            tries++;
            const px = (Math.random() - 0.5) * 34;
            const py = (Math.random() - 0.5) * 35;
            if (insideHeart(px, py)) {
                const nd = Math.sqrt((px*px)/256 + (py*py)/289); // 归一化距离
                if (Math.random() < 0.25 + 0.75 * (1 - nd)) {
                    arr.push({
                        hx: px + (Math.random()-0.5)*1.2,
                        hy: py + (Math.random()-0.5)*1.2,
                        hz: 0.05 + nd * 0.8,
                        type: 'interior'
                    });
                    gen++;
                }
            }
        }
        return arr;
    }

    // ── 粒子组装 ──────────────────────────────
    const MAIN_N = 3200;
    let particles = [];

    function generateAll() {
        const sea  = generateSeaPositions(MAIN_N);
        const heart = generateHeartPositions(MAIN_N);
        particles = sea.map((s, i) => ({
            // 海
            nx: s.nx, ny: s.ny, wp: s.wp,
            // 爱心
            hx: heart[i].hx, hy: heart[i].hy, hz: heart[i].hz,
            // 渲染个性
            baseR: 1.0 + Math.random() * 2.8,
            hueShift: (Math.random() - 0.5) * 0.06,
            alphaBase: 0.45 + Math.random() * 0.55,
        }));
    }
    generateAll();

    // ── 飘散粒子系统 ──────────────────────────
    const SPARKLE_N = 200;
    let sparkles = [];
    function resetSparkle() {
        const t = Math.random() * Math.PI * 2;
        const r = 2 + Math.random() * 14;
        const sx = 16 * Math.pow(Math.sin(t), 3) + (Math.random()-0.5)*r;
        const sy = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t) + (Math.random()-0.5)*r;
        return {
            hx: sx, hy: sy,
            vx: (Math.random()-0.5) * 0.8,
            vy: -1.5 - Math.random() * 3,
            life: 0,
            maxLife: 1.5 + Math.random() * 3,
            size: 0.5 + Math.random() * 2.2,
            hue: 0.92 + Math.random() * 0.08,
        };
    }
    for (let i = 0; i < SPARKLE_N; i++) sparkles.push(resetSparkle());

    // ── 手势控制 ──────────────────────────────
    let targetProgress = 0;
    let morphProgress  = 0;
    let isPinching     = false;
    let initialDist    = 0;
    let lastPinchVal   = 0;

    function pinchDist(e) {
        if (e.touches.length < 2) return 0;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.sqrt(dx*dx + dy*dy);
    }

    c.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
            initialDist = pinchDist(e);
            isPinching = true;
        }
    }, { passive: false });

    c.addEventListener('touchmove', e => {
        e.preventDefault();
        if (!isPinching || e.touches.length < 2) return;
        const d = pinchDist(e);
        const scale = d / Math.max(initialDist, 1);
        let v = 1 - (scale - 0.25) / 0.75;
        v = Math.min(1, Math.max(0, v));
        lastPinchVal = v;
        targetProgress = v;
    }, { passive: false });

    c.addEventListener('touchend', e => {
        if (e.touches.length < 2) {
            isPinching = false;
            initialDist = 0;
        }
    });

    // PC 鼠标滚轮回退
    c.addEventListener('wheel', e => {
        e.preventDefault();
        targetProgress = Math.min(1, Math.max(0, targetProgress + (e.deltaY > 0 ? 0.03 : -0.03)));
    }, { passive: false });

    // ── 颜色插值工具 ──────────────────────────
    function lerp(a, b, t) { return a + (b - a) * t; }
    function lerpRGB(c1, c2, t) {
        return [
            lerp(c1[0], c2[0], t),
            lerp(c1[1], c2[1], t),
            lerp(c1[2], c2[2], t),
        ];
    }

    // 海色 (蓝-青) → 爱心色 (粉-金)
    const seaRGB   = [60, 140, 220];
    const heartRGB = [255, 100, 150];

    // ── 渲染循环 ──────────────────────────────
    function draw(ts) {
        const time = ts * 0.001;

        // ── 进度更新 ───────────────────────────
        if (!isPinching && targetProgress > 0.001) {
            targetProgress *= 0.97; // 优雅慢退
            if (targetProgress < 0.001) targetProgress = 0;
        }
        morphProgress += (targetProgress - morphProgress) * 0.07;

        const p = morphProgress;

        // ── 呼吸脉冲 ────────────────────────────
        let breath = 1;
        if (p > 0.7) {
            const bf = (p - 0.7) / 0.3;
            breath = 1 + 0.018 * Math.sin(time * 2.8) * bf;
        }

        // ── 背景渐变 ────────────────────────────
        const bgRGB = lerpRGB([4, 8, 30], [18, 4, 14], p);
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*0.75);
        const bg1 = lerpRGB([6,16,50], [30,8,20], p);
        const bg2 = lerpRGB([2,4,18], [12,2,8], p);
        grad.addColorStop(0, `rgb(${bg1[0]|0},${bg1[1]|0},${bg1[2]|0})`);
        grad.addColorStop(1, `rgb(${bg2[0]|0},${bg2[1]|0},${bg2[2]|0})`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // ── 爱心光晕 ────────────────────────────
        if (p > 0.35) {
            const af = Math.min(1, (p - 0.35) / 0.5);
            const ag = ctx.createRadialGradient(cx, cy, heartScale * 2, cx, cy, heartScale * 17 * breath);
            ag.addColorStop(0, `rgba(255,140,170,${0.18*af})`);
            ag.addColorStop(0.4, `rgba(255,80,130,${0.08*af})`);
            ag.addColorStop(0.7, `rgba(255,40,100,${0.03*af})`);
            ag.addColorStop(1, 'rgba(255,20,80,0)');
            ctx.fillStyle = ag;
            ctx.fillRect(0, 0, W, H);
        }

        // ── 波浪偏移场 ──────────────────────────
        function waveOX(nx, ny, ph) {
            return Math.sin(ny*8 + time*0.5 + ph)*18*(1-p)
                 + Math.cos(nx*6 + time*0.35 + ph*1.7)*12*(1-p);
        }
        function waveOY(nx, ny, ph) {
            return Math.sin(nx*7 + time*0.45 + ph)*20*(1-p)
                 + Math.cos(ny*5 + time*0.55 + ph*2.1)*16*(1-p)
                 + Math.sin((nx+ny)*4 + time*0.3)*10*(1-p);
        }

        // ── 绘制所有主粒子 ──────────────────────
        for (let i = 0; i < MAIN_N; i++) {
            const pt = particles[i];

            // 海位置（归一化 → 屏幕 + 波浪）
            const sx = pt.nx * W + waveOX(pt.nx, pt.ny, pt.wp);
            const sy = pt.ny * H + waveOY(pt.nx, pt.ny, pt.wp);

            // 爱心位置（归一化爱心坐标 → 屏幕）
            const hx = cx + pt.hx * heartScale * breath;
            const hy = cy + pt.hy * heartScale * breath;

            // 插值
            const x = lerp(sx, hx, p);
            const y = lerp(sy, hy, p);

            // 颜色
            const hueShift = pt.hueShift;
            const rgb = lerpRGB(seaRGB, heartRGB, p);
            const r = rgb[0] + hueShift * 255;
            const g = rgb[1] + hueShift * 180;
            const b = rgb[2] + hueShift * 100;

            // 粒子大小：海时小，爱心时根据深度变化
            const size = lerp(pt.baseR * 0.6, pt.baseR * (1.2 - pt.hz * 0.6), p);

            // 透明度
            const alpha = lerp(pt.alphaBase * 0.5, pt.alphaBase, p);

            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI*2);
            ctx.fillStyle = `rgba(${Math.max(0,r)|0},${Math.max(0,g)|0},${Math.max(0,b)|0},${alpha.toFixed(3)})`;
            ctx.fill();
        }

        // ── 飘散粒子 ────────────────────────────
        if (p > 0.4) {
            const sf = Math.min(1, (p - 0.4) / 0.4);
            for (let i = 0; i < SPARKLE_N; i++) {
                const sp = sparkles[i];
                sp.life += 0.016;
                if (sp.life >= sp.maxLife) {
                    Object.assign(sp, resetSparkle());
                    sp.life = 0;
                }
                const lifeFrac = sp.life / sp.maxLife;
                const fade = lifeFrac < 0.2 ? lifeFrac/0.2
                           : lifeFrac > 0.7 ? (1-lifeFrac)/0.3
                           : 1;
                const spAlpha = fade * 0.7 * sf;

                const sx = cx + sp.hx * heartScale * breath + sp.vx * sp.life * 40;
                const sy = cy + sp.hy * heartScale * breath + sp.vy * sp.life * 40;

                const sh = sp.hue * 360;
                ctx.beginPath();
                ctx.arc(sx, sy, sp.size * (1 - lifeFrac*0.5), 0, Math.PI*2);
                ctx.fillStyle = `hsla(${sh},90%,70%,${spAlpha.toFixed(3)})`;
                ctx.fill();

                // 大颗飘散粒子加微光晕
                if (sp.size > 1.5 && fade > 0.5) {
                    ctx.beginPath();
                    ctx.arc(sx, sy, sp.size * 2.5, 0, Math.PI*2);
                    ctx.fillStyle = `hsla(${sh},80%,75%,${(spAlpha*0.15).toFixed(4)})`;
                    ctx.fill();
                }
            }
        }

        // ── 爱心成形后的亮点 ────────────────────
        if (p > 0.85) {
            const hf = (p - 0.85) / 0.15;
            const hg = ctx.createRadialGradient(cx, cy - heartScale*3, heartScale*0.5, cx, cy, heartScale*10*breath);
            hg.addColorStop(0, `rgba(255,220,180,${0.12*hf})`);
            hg.addColorStop(0.5, `rgba(255,150,180,${0.04*hf})`);
            hg.addColorStop(1, 'rgba(255,80,120,0)');
            ctx.fillStyle = hg;
            ctx.fillRect(0, 0, W, H);
        }

        requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
})();
</script>
</body>
</html>
